name: Weekly

# Slower checks that need PHP with a browser, or the npm registry: once a week and on demand.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  livewire:
    name: Livewire end-to-end
    if: github.repository == 'authorOd/3d-anatomy-atlas'
    # Playwright 1.56.1 cannot install Chromium on Ubuntu 26.04 (ubuntu-latest since October 2026); 1.61 can.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --no-progress
        working-directory: packages/laravel
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:laravel:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-laravel
          path: |
            playwright-report-laravel/
            test-results/
          retention-days: 7

  clean-install:
    name: Clean install
    if: github.repository == 'authorOd/3d-anatomy-atlas'
    # Ubuntu 24.04 for the same Playwright reason as the Livewire job.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check:clean-install
