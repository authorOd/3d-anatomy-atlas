<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Embeds test page</title>
    <style>
      body {
        margin: 0;
        padding: 24px 16px 80px;
        background: #f4f1ea;
        color: #1d2429;
        font: 16px/1.6 system-ui, sans-serif;
      }
      article {
        max-width: 760px;
        margin: 0 auto;
      }
      figure {
        margin: 24px 0;
      }
      figcaption {
        margin-top: 6px;
        font-size: 14px;
        color: #52606b;
      }
      .spacer {
        height: 900px;
      }
    </style>
  </head>
  <body>
    <article>
      <h1>Серце</h1>
      <p>Тестовий конспект із кількома вставками атласу (синтетичні дані).</p>
      <figure>
        <svitylo-anatomy id="e1" layout="embed" data-url="/test-data/1.0.0/" lang="uk" structure="cardiovascular.heart" label="Серце"></svitylo-anatomy>
        <figcaption>Серце</figcaption>
      </figure>
      <p>Лівий шлуночок в оточенні найближчої групи.</p>
      <figure>
        <svitylo-anatomy
          id="e2"
          layout="embed"
          data-url="/test-data/1.0.0/"
          lang="uk"
          structure="cardiovascular.heart.left_ventricle"
          surroundings="1"
          view="left"
          height="320"
          label="Лівий шлуночок"
        ></svitylo-anatomy>
      </figure>
      <div class="spacer"></div>
      <figure>
        <svitylo-anatomy id="e3" layout="embed" data-url="/test-data/1.0.0/" lang="uk" system="skeletal" label="Скелет"></svitylo-anatomy>
      </figure>
    </article>
    <script type="module">
      import { SvityloAnatomyElement } from '@authorod/svitylo-3d-anatomy-atlas';
      const limit = new URLSearchParams(location.search).get('max');
      if (limit) SvityloAnatomyElement.maxActiveEmbeds = Number(limit);
    </script>
  </body>
</html>
